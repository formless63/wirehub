<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 8.5" width="16mm" height="8.5mm">
  <title>USB Type-A plug — mating face</title>
  <desc>Drawn for WireHub from public dimensions; CC0-1.0, not traced from any vendor drawing.</desc>
  <g fill="none" stroke="currentColor" stroke-width="0.15" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="12" height="4.5" rx="0.4"/>
    <rect x="3" y="3" width="10" height="2.5"/>
    <rect data-pin="1" x="10.9" y="3.9" width="1.2" height="1.4"/>
    <text x="11.5" y="8" font-size="1.3" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">1</text>
    <rect data-pin="2" x="8.4" y="3.9" width="1.2" height="1.4"/>
    <text x="9" y="8" font-size="1.3" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">2</text>
    <rect data-pin="3" x="6.4" y="3.9" width="1.2" height="1.4"/>
    <text x="7" y="8" font-size="1.3" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">3</text>
    <rect data-pin="4" x="3.9" y="3.9" width="1.2" height="1.4"/>
    <text x="4.5" y="8" font-size="1.3" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">4</text>
  </g>
</svg>
