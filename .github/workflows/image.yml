name: Image

# Builds the WireHub image for amd64 and arm64 and pushes it to
# ghcr.io/formless63/wirehub — only for a release:
#
#   a published release vX.Y.Z  →  X.Y.Z, X.Y, X (from 1.0 on), latest
#                                  (release-please.yml calls this; a release
#                                  published by hand triggers it directly)
#   manual run (workflow_dispatch) → `edge` (or the tag you type) from the
#                                  chosen branch, for testing; never `latest`
#
# Nothing is published on an ordinary push.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: the release tag, vX.Y.Z
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: image tag for a test build
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/formless63/wirehub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: What to build
        id: what
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            tag="${RELEASE_TAG:-$INPUT_TAG}"
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $tag" >&2; exit 1 ;; esac
            echo "ref=refs/tags/${tag}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.what.outputs.tag }},enable=${{ steps.what.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.what.outputs.tag }},enable=${{ steps.what.outputs.release }}
            type=semver,pattern={{major}},value=${{ steps.what.outputs.tag }},enable=${{ steps.what.outputs.release }}
            type=raw,value=latest,enable=${{ steps.what.outputs.release == 'true' && !contains(steps.what.outputs.tag, '-') }}
            type=raw,value=${{ steps.what.outputs.tag }},enable=${{ steps.what.outputs.release != 'true' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=WireHub
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WIREHUB_VERSION=${{ steps.meta.outputs.version }}
            WIREHUB_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
