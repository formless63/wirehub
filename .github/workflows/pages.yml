name: Pages

# Publishes the site (site/) to GitHub Pages: https://formless63.github.io/wirehub/
# Home (/), the config generator (/generator/, one self-contained page with the
# repository's compose.yaml embedded), a docs placeholder (/docs/) and the
# browsable module store (/store/), rebuilt whenever they change.
# (Settings → Pages → Source: GitHub Actions.)
#
# It also publishes bundled catalog packs and explicitly selected optional runtime
# modules in the official store index at https://formless63.github.io/wirehub/store/index.json (the packs
# zipped beside it), signed with the WIREHUB_STORE_SIGNING_KEY secret
# (docs/catalog-store.md §4). Without the secret the index is published
# unsigned, with a warning, and deployments refuse it until it is signed.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - compose.yaml
      - brand/**
      - modules/*/src/**
      - modules/*/pack/**
      - modules/*/package.json
      - modules/*/tsconfig.json
      - modules/*/LICENSE
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - apps/studio/tsconfig.json
      - apps/studio/scripts/wirehub-module.ts
      - apps/studio/src/node-shim.ts
      - apps/studio/server/pg/module-migrations.ts
      - packages/model/src/**
      - packages/docs/src/**
      - packages/modules/src/**
      - packages/catalog/src/**
      - scripts/build-official-runtime.mjs
      - scripts/official-store-meta.json
      - scripts/store-index.mjs
      - apps/studio/server/pack-archive.ts
      - apps/studio/server/store.ts
      - apps/studio/modules.config.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # the store bundler reads packs back with the studio's own archive reader (workspace packages)
      - run: pnpm install --frozen-lockfile
      # the generator's default output must be the repository's compose.yaml; every page carries the nav
      - run: pnpm --filter site test
      # the whole site: home, generator, docs, and the store's browsable page (store/index.html)
      - run: node site/build.mjs site/dist
      # the official store index: bundled data packs and allowlisted runtime modules. With the
      # WIREHUB_PACK_SIGNING_KEY secret the packs are signed first as the publisher 'wirehub' and
      # the index lists that publisher (signedBy); without it, unsigned packs and no publishers.
      - name: Build the official store index
        env:
          WIREHUB_PACK_SIGNING_KEY: ${{ secrets.WIREHUB_PACK_SIGNING_KEY }}
        run: |
          meta=""
          if [ -z "$WIREHUB_PACK_SIGNING_KEY" ]; then
            echo "::warning title=Packs not signed::The WIREHUB_PACK_SIGNING_KEY secret is not set, so the bundled packs are published unsigned and the official index lists no publishers. See docs/catalog-store.md."
          else
            recorded="$(node scripts/store-index.mjs official-publisher-key)"
            pub="$(WIREHUB_STORE_SIGNING_KEY="$WIREHUB_PACK_SIGNING_KEY" node scripts/store-index.mjs pubkey)"
            if [ "$recorded" != "$pub" ]; then
              echo "::error title=Publisher key mismatch::The WIREHUB_PACK_SIGNING_KEY secret's public key ($pub) is not the recorded publisher key in scripts/official-store-meta.json ($recorded)."
              exit 1
            fi
            for pack in modules/*/pack; do
              [ "$pack" = "modules/example/pack" ] && continue
              [ -f "$pack/wirehub-pack.json" ] || continue
              node scripts/store-index.mjs sign-pack "$pack"
              node scripts/store-index.mjs verify-pack-signature "$pack" --pubkey "$recorded"
            done
            meta="--meta scripts/official-store-meta.json"
          fi
          # Only the explicit optional packages are bundled as runtime code;
          # built-in modules stay built in. No publisher key means no code zip.
          node scripts/build-official-runtime.mjs site/dist/store
          node scripts/store-index.mjs official --out site/dist/store $meta
      - name: Sign the store index
        env:
          WIREHUB_STORE_SIGNING_KEY: ${{ secrets.WIREHUB_STORE_SIGNING_KEY }}
        run: |
          if [ -z "$WIREHUB_STORE_SIGNING_KEY" ]; then
            echo "::warning title=Store index not signed::The WIREHUB_STORE_SIGNING_KEY secret is not set, so store/index.json is published unsigned and deployments will refuse it. See docs/catalog-store.md section 4 to create the key."
            exit 0
          fi
          node scripts/store-index.mjs sign site/dist/store/index.json --required
          pub="$(node scripts/store-index.mjs pubkey)"
          node scripts/store-index.mjs verify site/dist/store/index.json --pubkey "$pub"
          printf 'untrusted comment: WireHub official store public key\n%s\n' "$pub" > site/dist/store/wirehub-store.pub
          # the key deployments trust (OFFICIAL_STORE_PUBLIC_KEY) must be this one, once it is recorded
          recorded="$(node scripts/store-index.mjs official-pubkey)"
          if [ -n "$recorded" ] && [ "$recorded" != "$pub" ]; then
            echo "::error title=Store key mismatch::The signing secret's public key ($pub) is not OFFICIAL_STORE_PUBLIC_KEY in apps/studio/server/store.ts ($recorded)."
            exit 1
          fi
          if [ -z "$recorded" ]; then
            echo "::notice title=Store public key::Record $pub as OFFICIAL_STORE_PUBLIC_KEY in apps/studio/server/store.ts so deployments trust the official index."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true # .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
