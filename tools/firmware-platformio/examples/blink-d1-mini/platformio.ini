; Synthetic, public-safe example for the firmware-platformio tool pack.
; LED_PIN, BLINK_MS and DEVICE_NAME arrive as -D build flags from WireHub's
; project configuration and per-occurrence overrides; the defaults in
; src/main.cpp apply when the sketch is built on its own.
[env:d1_mini]
platform = platformio/espressif8266@4.2.1
board = d1_mini
framework = arduino
