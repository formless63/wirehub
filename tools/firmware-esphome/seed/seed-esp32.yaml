# Build-time seed (synthetic): pre-fetches the ESP8266 platform, framework, toolchain and the
# libraries common components need, so a compile runs with no network.
esphome:
  name: seed-esp32
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: seed
  password: seedseedseed
  ap:
    ssid: seed-ap
captive_portal:
mdns:
i2c:
sensor:
  - platform: uptime
    name: Uptime
switch:
  - platform: gpio
    pin: GPIO2
    name: Relay
binary_sensor:
  - platform: gpio
    pin: { number: GPIO4, mode: INPUT_PULLUP }
    name: Button
