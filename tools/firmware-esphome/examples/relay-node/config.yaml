# Synthetic, public-safe example: one relay and one button on an ESP32 dev board.
substitutions:
  device_name: bench-node
  relay_pin: GPIO2

esphome:
  name: ${device_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}-fallback
captive_portal:

switch:
  - platform: gpio
    pin: ${relay_pin}
    name: Relay
binary_sensor:
  - platform: gpio
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true }
    name: Button
