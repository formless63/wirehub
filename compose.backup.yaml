# WireHub — optional backups (restic, through Backrest's web UI).
#
#   docker compose -f compose.yaml -f compose.backup.yaml up -d
#   open http://localhost:9898  → add a restic repository and a plan
#
# Three services stage everything into one place and Backrest snapshots it:
#
#   backup-dump    pg_dump of the database into the `backups` volume, at start
#                  and daily at BACKUP_DUMP_AT
#   backup-mirror  rclone mirror of the Garage bucket (read-only key) into the
#                  `backups` volume, every BACKUP_MIRROR_INTERVAL seconds
#   backrest       restic with a web UI. It sees, read-only:
#                    /sources/backups   the dump and the bucket mirror
#                    /sources/catalog   the catalog volume (today's data!)
#                    /sources/auth      sign-in state and the save audit log
#                  and snapshots them to any restic repository: a REST server
#                  on another machine, S3/B2/R2, SFTP, or a local disk.
#
# Recommended plan (docs/self-hosting.md): paths /sources, daily at 03:00
# (after the 02:30 dump), retention 7 daily / 4 weekly / 12 monthly, a weekly
# `check`, and a repository on another machine or provider.
#
# `rest-server` (profile `rest-server`) is a restic REST server for trying the
# setup on one machine; a real repository lives elsewhere — run rest-server on
# a NAS or another host, or use a cloud bucket.

services:
  backup-dump:
    image: postgres:18.6-bookworm
    entrypoint: ["bash", "/scripts/pg-dump.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}
      BACKUP_DUMP_AT: ${BACKUP_DUMP_AT:-02:30}
      BACKUP_KEEP_DUMPS: ${BACKUP_KEEP_DUMPS:-7}
      TZ: ${TZ:-UTC}
    volumes:
      - ./docker/backup/pg-dump.sh:/scripts/pg-dump.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal]

  backup-mirror:
    image: rclone/rclone:1.75.1
    entrypoint: ["sh", "/scripts/blob-mirror.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      BACKUP_MIRROR_INTERVAL: ${BACKUP_MIRROR_INTERVAL:-3600}
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:?set S3_BACKUP_ACCESS_KEY_ID (scripts/setup-env.sh)}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:?set S3_BACKUP_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/backup/blob-mirror.sh:/scripts/blob-mirror.sh:ro
      - backups:/backups
    depends_on:
      garage-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal]

  backrest:
    image: garethgeorge/backrest:v1.14.1
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: ${TZ:-UTC}
    volumes:
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      - backups:/sources/backups:ro
      - catalog:/sources/catalog:ro
      - auth:/sources/auth:ro
    ports:
      - "${BACKREST_BIND:-127.0.0.1}:${BACKREST_PORT:-9898}:9898"
    mem_limit: 512m
    restart: unless-stopped
    # internal: reach rest-server; public: reach a remote repository
    networks: [internal, public]

  rest-server:
    profiles: [rest-server]
    image: restic/rest-server:0.14.0
    environment:
      DISABLE_AUTHENTICATION: "1"
    volumes:
      - restic_repo:/data
    mem_limit: 128m
    restart: unless-stopped
    networks: [internal]

volumes:
  backups:
  backrest_data:
  backrest_config:
  backrest_cache:
  restic_repo:
