# WireHub — the self-hosted stack, in one file.
#
#   docker compose up -d             # then open http://localhost:5183/setup
#
# No .env is needed: the `bootstrap` service generates every secret on first
# run into the `secrets` volume, and the app prints the first-run setup code
# in its log (`docker compose logs wirehub`, or the wirehub container's logs
# in your Docker UI). An optional .env (see .env.example, or the config
# generator: https://formless63.github.io/wirehub/) sets the public URL,
# ports, optional parts, your own S3 or Postgres, sign-in and backups.
#
# Default services:
#   bootstrap    one-shot: secrets, the setup code and Garage's config
#   wirehub      the app (UI + API), the only published port
#   postgres     PostgreSQL 18 (the first release runs on it; until the
#                database backend's write path lands the app keeps its
#                catalog in the `catalog` volume)
#   migrate      one-shot: the database roles and every pending migration
#   garage       S3-compatible store for uploaded files (photos, datasheets,
#                3D models) — Garage, single node
#   garage-init  one-shot: Garage's layout, its access keys and the bucket
#
# Optional parts are profiles, chosen with COMPOSE_PROFILES in .env:
#   backup       restic backups through Backrest (web UI on port 9898):
#                backup-init, backup-dump, backup-mirror, backrest
#
# Using your own Postgres or S3: delete the blocks between ">>> bundled-…" and
# "<<< bundled-…" and set DATABASE_ADMIN_URL or the S3_* variables (the config
# generator does both for you).
#
# Nothing is published beyond the app's port (and Backrest's, with the backup
# profile), which bind to 127.0.0.1 unless WIREHUB_BIND / BACKREST_BIND say
# otherwise; put a TLS-terminating reverse proxy in front for anything but
# local use.

name: wirehub

services:
  bootstrap:
    image: &wirehub-image ${WIREHUB_IMAGE:-ghcr.io/formless63/wirehub:0.1.0} # x-release-please-version
    user: "0:0"
    command: ["node", "--experimental-strip-types", "--no-warnings", "stack/bootstrap.ts"]
    environment:
      # explicit values win over generated ones (unset = generate)
      POSTGRES_PASSWORD:
      WIREHUB_OWNER_PASSWORD:
      WIREHUB_APP_PASSWORD:
      WIREHUB_RO_PASSWORD:
      # your own Postgres: an admin connection; the role URLs are derived from it
      DATABASE_ADMIN_URL:
      DATABASE_OWNER_URL:
      DATABASE_URL:
      DATABASE_RO_URL:
      BETTER_AUTH_SECRET:
      GARAGE_RPC_SECRET:
      GARAGE_ADMIN_TOKEN:
      WIREHUB_SETUP_CODE:
      S3_REGION: ${S3_REGION:-garage}
    volumes:
      - secrets:/run/wirehub
    network_mode: none
    mem_limit: 128m
    restart: "no"

  wirehub:
    image: *wirehub-image
    environment:
      BETTER_AUTH_URL: ${WIREHUB_PUBLIC_URL:-http://localhost:${WIREHUB_PORT:-5183}}
      WIREHUB_BACKEND: ${WIREHUB_BACKEND:-files}
      WIREHUB_ORG:
      WIREHUB_SUGGESTED_MODULES:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_DATA_DIR: /data/auth
      WIREHUB_MODEL_CACHE_DIR: /data/cache/models
      WIREHUB_PACKS_DIR: /data/packs
      WIREHUB_BLOBS: ${WIREHUB_BLOBS:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      # secrets: the generated files, unless set explicitly
      DATABASE_URL:
      DATABASE_URL_FILE: /run/wirehub/database_url
      BETTER_AUTH_SECRET:
      BETTER_AUTH_SECRET_FILE: /run/wirehub/better_auth_secret
      WIREHUB_SETUP_CODE:
      WIREHUB_SETUP_CODE_FILE: /run/wirehub/setup_code
      S3_ACCESS_KEY_ID:
      S3_ACCESS_KEY_ID_FILE: /run/wirehub/s3_access_key_id
      S3_SECRET_ACCESS_KEY:
      S3_SECRET_ACCESS_KEY_FILE: /run/wirehub/s3_secret_access_key
      # optional sign-in (apps/studio/README.md, "Auth")
      AUTH_ALLOWED_EMAILS:
      AUTH_OIDC_ISSUER:
      AUTH_OIDC_CLIENT_ID:
      AUTH_OIDC_CLIENT_SECRET:
      AUTH_OIDC_SCOPES:
      AUTH_OIDC_EMAIL_CLAIM:
      AUTH_OIDC_PROVIDER_ID:
      AUTH_OIDC_NAME:
      AUTH_SMTP_HOST:
      AUTH_SMTP_PORT:
      AUTH_SMTP_SECURE:
      AUTH_SMTP_USER:
      AUTH_SMTP_PASS:
      AUTH_SMTP_FROM:
      WIREHUB_LOCAL_USER:
      TZ: ${TZ:-UTC}
    ports:
      - "${WIREHUB_BIND:-127.0.0.1}:${WIREHUB_PORT:-5183}:5183"
    volumes:
      - catalog:/app/packages/catalog/data
      - auth:/data/auth
      - packs:/data/packs
      - blobs:/data/blobs
      - cache:/data/cache
      - secrets:/run/wirehub:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      # >>> bundled-s3
      garage-init:
        condition: service_completed_successfully
      # <<< bundled-s3
    mem_limit: 768m
    restart: unless-stopped
    networks: [internal, public]

  migrate:
    image: *wirehub-image
    # *_FILE variables resolved first (server/boot-env.ts), then the roles and the migrations
    command:
      - sh
      - -c
      - >-
        node --experimental-strip-types --no-warnings --import ./server/boot-env.ts server/pg/cli.ts bootstrap &&
        node --experimental-strip-types --no-warnings --import ./server/boot-env.ts server/pg/cli.ts migrate
    environment:
      DATABASE_ADMIN_URL_FILE: /run/wirehub/database_admin_url
      DATABASE_OWNER_URL_FILE: /run/wirehub/database_owner_url
      DATABASE_URL_FILE: /run/wirehub/database_url
      WIREHUB_OWNER_PASSWORD_FILE: /run/wirehub/wirehub_owner_password
      WIREHUB_APP_PASSWORD_FILE: /run/wirehub/wirehub_app_password
      WIREHUB_RO_PASSWORD_FILE: /run/wirehub/wirehub_ro_password
    volumes:
      - secrets:/run/wirehub:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      # >>> bundled-postgres
      postgres:
        condition: service_healthy
      # <<< bundled-postgres
    mem_limit: 256m
    restart: "no"
    networks: [internal, public]

  # >>> bundled-postgres: the bundled PostgreSQL 18. Using your own? Delete down to "<<< bundled-postgres" and set DATABASE_ADMIN_URL.
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: wirehub
      POSTGRES_DB: wirehub
      POSTGRES_PASSWORD_FILE: /run/wirehub/postgres_password
    volumes:
      - pg_data:/var/lib/postgresql
      - secrets:/run/wirehub:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirehub -d wirehub"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    restart: unless-stopped
    networks: [internal]
  # <<< bundled-postgres

  # >>> bundled-s3: Garage, the bundled S3 store. Using your own S3? Delete down to "<<< bundled-s3" and set the S3_* variables.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "-c", "/run/wirehub/garage.toml", "server"]
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - secrets:/run/wirehub:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal]

  garage-init:
    image: *wirehub-image
    command: ["node", "--experimental-strip-types", "--no-warnings", "stack/garage-init.ts"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-100G}
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      # explicit keys are imported and win; otherwise Garage creates them
      S3_ACCESS_KEY_ID:
      S3_SECRET_ACCESS_KEY:
      S3_BACKUP_ACCESS_KEY_ID:
      S3_BACKUP_SECRET_ACCESS_KEY:
    volumes:
      - secrets:/run/wirehub
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      garage:
        condition: service_started
    mem_limit: 128m
    restart: "no"
    networks: [internal]
  # <<< bundled-s3

  # --- profile `backup`: restic through Backrest ----------------------------
  # backup-dump and backup-mirror stage the database dump and a mirror of the
  # bucket into the `backups` volume; Backrest snapshots it with the catalog,
  # auth and packs volumes to BACKUP_REPOSITORY (default: a local repository
  # in the `restic_repo` volume — set a repository on another machine).
  backup-init:
    profiles: [backup]
    image: *wirehub-image
    user: "0:0"
    command: ["node", "--experimental-strip-types", "--no-warnings", "stack/backup-init.ts"]
    environment:
      BACKREST_CONFIG: /config/config.json
      BACKUP_REPOSITORY:
      BACKUP_REPOSITORY_PASSWORD:
      BACKUP_AWS_ACCESS_KEY_ID:
      BACKUP_AWS_SECRET_ACCESS_KEY:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
    volumes:
      - secrets:/run/wirehub
      - backrest_config:/config
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    network_mode: none
    mem_limit: 128m
    restart: "no"

  backup-dump:
    profiles: [backup]
    image: postgres:18.6-bookworm
    entrypoint: ["bash", "/run/wirehub/backup/pg-dump.sh"]
    environment:
      # the admin connection: every schema, whoever owns it
      DATABASE_URL_FILE: /run/wirehub/database_admin_url
      BACKUP_DUMP_AT: ${BACKUP_DUMP_AT:-02:30}
      BACKUP_KEEP_DUMPS: ${BACKUP_KEEP_DUMPS:-7}
      TZ: ${TZ:-UTC}
    volumes:
      - secrets:/run/wirehub:ro
      - backups:/backups
    depends_on:
      backup-init:
        condition: service_completed_successfully
      # >>> bundled-postgres
      postgres:
        condition: service_healthy
      # <<< bundled-postgres
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal, public]

  backup-mirror:
    profiles: [backup]
    image: rclone/rclone:1.75.1
    entrypoint: ["sh", "/run/wirehub/backup/blob-mirror.sh"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      BACKUP_MIRROR_INTERVAL: ${BACKUP_MIRROR_INTERVAL:-3600}
      S3_BACKUP_ACCESS_KEY_ID:
      S3_BACKUP_ACCESS_KEY_ID_FILE: /run/wirehub/s3_backup_access_key_id
      S3_BACKUP_SECRET_ACCESS_KEY:
      S3_BACKUP_SECRET_ACCESS_KEY_FILE: /run/wirehub/s3_backup_secret_access_key
      S3_ACCESS_KEY_ID:
      S3_ACCESS_KEY_ID_FILE: /run/wirehub/s3_access_key_id
      S3_SECRET_ACCESS_KEY:
      S3_SECRET_ACCESS_KEY_FILE: /run/wirehub/s3_secret_access_key
    volumes:
      - secrets:/run/wirehub:ro
      - backups:/backups
    depends_on:
      backup-init:
        condition: service_completed_successfully
      # >>> bundled-s3
      garage-init:
        condition: service_completed_successfully
      # <<< bundled-s3
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal, public]

  backrest:
    profiles: [backup]
    image: garethgeorge/backrest:v1.14.1
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: ${TZ:-UTC}
    volumes:
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      - restic_repo:/repos
      - backups:/sources/backups:ro
      - catalog:/sources/catalog:ro
      - auth:/sources/auth:ro
      - packs:/sources/packs:ro
    ports:
      - "${BACKREST_BIND:-127.0.0.1}:${BACKREST_PORT:-9898}:9898"
    depends_on:
      backup-init:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped
    # internal: the staging services; public: a repository on another machine
    networks: [internal, public]

networks:
  # postgres and garage are reachable only from the stack, never published
  internal:
    internal: true
  public: {}

volumes:
  secrets:
  catalog:
  auth:
  packs:
  blobs:
  cache:
  # >>> bundled-postgres
  pg_data:
  # <<< bundled-postgres
  # >>> bundled-s3
  garage_meta:
  garage_data:
  # <<< bundled-s3
  backups:
  backrest_data:
  backrest_config:
  backrest_cache:
  restic_repo:
