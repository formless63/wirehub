# WireHub — the default self-hosted stack.
#
#   bash scripts/setup-env.sh        # once: writes .env with generated secrets
#   docker compose up -d             # then open http://localhost:5183
#
# Services:
#   wirehub      the app (Node server + built UI), the only published port
#   garage       S3-compatible object store for uploaded files (photos,
#                datasheets, 3D models) — Garage, single node
#   garage-init  one-shot: Garage layout, access keys and the bucket
#   postgres     PostgreSQL 18 — PROVISIONED FOR THE UPCOMING DATABASE
#                BACKEND (specs/postgres-backend.md, phases A–D). WireHub does
#                not use it yet: today the catalog and designs are JSON files
#                in the `catalog` volume. It runs now so an install made
#                today has its database (and its backups) in place when the
#                backend lands; skip it with `docker compose up -d wirehub`.
#
# What holds your data today: the `catalog` volume (definitions, designs,
# drawings, versions), the `auth` volume (sign-in sessions, save audit log) and
# the Garage volumes (uploaded file bytes). compose.backup.yaml backs all of
# them up, plus the Postgres dump.
#
# Fallback without object storage: set STUDIO_BLOBS=fs:/data/blobs in .env
# and start only the app: `docker compose up -d --no-deps wirehub`.
#
# Every setting is in .env (documented in .env.example). Nothing here is
# published beyond the app's port, which binds to 127.0.0.1 unless
# WIREHUB_BIND says otherwise; put a TLS-terminating reverse proxy in front
# for anything but local use.

name: wirehub

x-app-image: &app-image
  image: ${WIREHUB_IMAGE:-ghcr.io/formless63/wirehub:edge}
  build:
    context: .
    dockerfile: docker/app.Dockerfile

services:
  wirehub:
    <<: *app-image
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_DATA_DIR: /data/auth
      STUDIO_MODEL_CACHE_DIR: /data/cache/models
      STUDIO_BLOBS: ${STUDIO_BLOBS:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/setup-env.sh first (see .env.example)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/setup-env.sh first}
    ports:
      - "${WIREHUB_BIND:-127.0.0.1}:${WIREHUB_PORT:-5183}:5183"
    volumes:
      - catalog:/app/packages/catalog/data
      - auth:/data/auth
      - blobs:/data/blobs
      - cache:/data/cache
    depends_on:
      garage-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    networks: [internal, public]

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run scripts/setup-env.sh first}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run scripts/setup-env.sh first}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal]

  garage-init:
    # the app image (built or pulled for `wirehub`): node runs the init script
    image: ${WIREHUB_IMAGE:-ghcr.io/formless63/wirehub:edge}
    pull_policy: missing
    command: ["node", "/app/docker/garage/init.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run scripts/setup-env.sh first}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-100G}
      S3_BUCKET: ${S3_BUCKET:-wirehub}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/setup-env.sh first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/setup-env.sh first}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
    depends_on:
      - garage
    mem_limit: 128m
    restart: "no"
    networks: [internal]

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: wirehub
      POSTGRES_DB: wirehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirehub -d wirehub"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    restart: unless-stopped
    networks: [internal]

networks:
  # garage and postgres are reachable only from the stack, never published
  internal:
    internal: true
  public: {}

volumes:
  catalog:
  auth:
  blobs:
  cache:
  garage_meta:
  garage_data:
  pg_data:
